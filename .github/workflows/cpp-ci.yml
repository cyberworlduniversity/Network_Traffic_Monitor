name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C++17 source
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -fsyntax-only Network_Traffic_Monitor.cpp
